<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans TC", system-ui, sans-serif; }
    a { color: #C8975A; } a:hover { color: #E0B478; }
    select.bk-script option { background: #1E1B17; color: #EDE8E0; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; min-height: 844px; background: #14120F; color: #EDE8E0;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid #2A251E;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8975A" stroke-width="2"><path d="M5 12l5 5L19 7"/></svg>
      <div style="font-size: 15px; font-weight: 700; letter-spacing: -.01em;">Booking King</div>
    </div>
    <div style="width: 30px; height: 30px; border-radius: 8px; background: #1E1B17; display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8177" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </div>
  </div>

  <!-- 劇本選單本身就是頁面標題，選了才會往下長出其他區塊 -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 18px 0;">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #8A8177;">選擇劇本</div>
    <div style="position: relative;">
      <select
        class="bk-script"
        onChange="{{handlePickScript}}"
        style="width: 100%; appearance: none; -webkit-appearance: none; background: transparent; border: none; border-bottom: 2px solid #C8975A; padding: 4px 40px 12px 6px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; color: #EDE8E0; font-family: inherit;"
      >
        <option value="">請選擇劇本</option>
        <option value="1">竊雲台</option>
      </select>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8975A" stroke-width="2" style="position: absolute; right: 6px; bottom: 14px; pointer-events: none;"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>

  <sc-if value="{{hasSelection}}" hint-placeholder-val="{{true}}">
  <div style="display: flex; flex-direction: column; flex: 1;">

    <div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 18px 0;">
      <div style="font-size: 13px; font-weight: 500; color: #C8975A; background: #2A2318; padding: 6px 13px; border-radius: 6px;">10 小時</div>
      <div style="font-size: 13px; font-weight: 500; color: #C8975A; background: #2A2318; padding: 6px 13px; border-radius: 6px;">6 人</div>
      <div style="font-size: 13px; font-weight: 500; color: #C8975A; background: #2A2318; padding: 6px 13px; border-radius: 6px;">NT$ 2,000</div>
      <div style="font-size: 13px; font-weight: 500; color: #C8975A; background: #2A2318; padding: 6px 13px; border-radius: 6px;">訂金 NT$ 1,000</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 18px 0;">
      <div style="font-size: 13px; font-weight: 700; color: #8A8177;">場次</div>
      <div style="display: flex; gap: 10px;">

        <div style="flex: 1; display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 12px; color: #8A8177;">日期</div>
          <div style="position: relative;">
            <select
              class="bk-script"
              onChange="{{handlePickDate}}"
              style="width: 100%; appearance: none; -webkit-appearance: none; background: #1E1B17; border: 1.5px solid #C8975A; border-radius: 10px; padding: 14px 40px 14px 18px; font-size: 16px; font-weight: 700; color: #EDE8E0; font-family: inherit;"
            >
              <option value="">未選擇</option>
              <option value="2026-08-30">8/30（六）</option>
            </select>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8975A" stroke-width="2" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none;"><path d="M9 6l6 6-6 6"/></svg>
          </div>
        </div>

        <div style="flex: 1; display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 12px; color: #8A8177;">時間</div>
          <div style="position: relative;">
            <select
              class="bk-script"
              disabled="{{timeDisabled}}"
              onChange="{{handlePickTime}}"
              style="width: 100%; appearance: none; -webkit-appearance: none; background: {{timeBg}}; border: 1.5px solid {{timeBorder}}; border-radius: 10px; padding: 14px 40px 14px 18px; font-size: 16px; font-weight: 700; color: {{timeColor}}; font-family: inherit;"
            >
              <option value="">未選擇</option>
              <option value="10:00">10:00</option>
            </select>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{timeColor}}" stroke-width="2" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none;"><path d="M9 6l6 6-6 6"/></svg>
          </div>
          <div style="font-size: 12px; color: #8A8177; min-height: 16px;">
            <sc-if value="{{hasTime}}" hint-placeholder-val="{{true}}">預計 20:00 結束</sc-if>
          </div>
        </div>

      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 20px 18px 0;">
      <div style="font-size: 13px; font-weight: 700; color: #8A8177;">選擇主持人</div>
      <div style="display: flex; flex-direction: column; gap: 12px;">

        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 12px; color: #8A8177;">柳送君</div>
          <div style="position: relative;">
            <select class="bk-script" style="width: 100%; appearance: none; -webkit-appearance: none; background: #1A1713; border: 1px solid #332D24; border-radius: 10px; padding: 12px 40px 12px 18px; font-size: 15px; font-weight: 500; color: #EDE8E0; font-family: inherit;">
              <option value="">未選擇</option>
              <option value="1">阿舍老師</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8177" stroke-width="2" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none;"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 12px; color: #8A8177;">朱懿辰</div>
          <div style="position: relative;">
            <select class="bk-script" style="width: 100%; appearance: none; -webkit-appearance: none; background: #1A1713; border: 1px solid #332D24; border-radius: 10px; padding: 12px 40px 12px 18px; font-size: 15px; font-weight: 500; color: #EDE8E0; font-family: inherit;">
              <option value="">未選擇</option>
              <option value="2">Arthur</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8177" stroke-width="2" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none;"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 12px; color: #8A8177;">九千歲</div>
          <div style="position: relative;">
            <select class="bk-script" style="width: 100%; appearance: none; -webkit-appearance: none; background: #1A1713; border: 1px solid #332D24; border-radius: 10px; padding: 12px 40px 12px 18px; font-size: 15px; font-weight: 500; color: #EDE8E0; font-family: inherit;">
              <option value="">未選擇</option>
              <option value="3">網飛</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8177" stroke-width="2" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none;"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

      </div>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-top: 1px solid #2A251E;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font-size: 14px; color: #A79C8E;">訂金</div>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -.02em;">NT$ 1,000</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; background: #C8975A; color: #14120F; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 700;">立即預約</div>
    </div>

  </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scriptId: '', date: '', time: '' };
  }

  renderVals() {
    const hasDate = this.state.date !== '';
    const hasTime = this.state.time !== '';
    return {
      hasSelection: this.state.scriptId !== '',
      handlePickScript: (e) => this.setState({ scriptId: e.target.value }),
      // 換日期時把時間重設——不然換到別的日期時，上一個日期選過的時間
      // 還殘留在選單裡，看起來像已經選好了，其實那個時段可能根本不存在。
      handlePickDate: (e) => this.setState({ date: e.target.value, time: '' }),
      handlePickTime: (e) => this.setState({ time: e.target.value }),
      hasDate,
      hasTime,
      timeDisabled: !hasDate,
      timeBorder: hasDate ? '#C8975A' : '#2A251E',
      timeColor: hasDate ? '#EDE8E0' : '#5C564C',
      timeBg: hasDate ? '#1E1B17' : '#17140F',
    };
  }
}
</script>
</body>
</html>
