<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans TC", system-ui, sans-serif; }
    a { color: #0B6E6E; } a:hover { color: #085252; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; min-height: 844px; background: #FFFFFF; color: #0F1419;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid #E3E8EA;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E6E" stroke-width="2"><path d="M5 12l5 5L19 7"/></svg>
      <div style="font-size: 15px; font-weight: 700; letter-spacing: -.01em;">Booking King</div>
    </div>
    <div style="width: 30px; height: 30px; border-radius: 8px; background: #EEF3F3; display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6A70" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 18px 0;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2;">竊雲台</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <div style="font-size: 13px; font-weight: 500; color: #0B6E6E; background: #EEF3F3; padding: 5px 10px; border-radius: 6px;">10 小時</div>
        <div style="font-size: 13px; font-weight: 500; color: #0B6E6E; background: #EEF3F3; padding: 5px 10px; border-radius: 6px;">6 人</div>
        <div style="font-size: 13px; font-weight: 500; color: #0B6E6E; background: #EEF3F3; padding: 5px 10px; border-radius: 6px;">NT$ 2,000</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 18px 0;">
    <div style="font-size: 13px; font-weight: 700; color: #5A6A70;">場次</div>
    <div style="display: flex; align-items: center; justify-content: space-between; border: 1.5px solid #0B6E6E; border-radius: 10px; padding: 14px 16px; background: #FBFDFD;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 16px; font-weight: 700;">8/30（六）10:00</div>
        <div style="font-size: 13px; color: #5A6A70;">預計 20:00 結束</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E6E" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 20px 18px 0;">
    <div style="font-size: 13px; font-weight: 700; color: #5A6A70;">選擇主持人</div>
    <div style="display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #E3E8EA; border-radius: 10px; padding: 12px 14px;">
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 12px; color: #5A6A70;">柳送君</div>
          <div style="font-size: 15px; font-weight: 500;">阿舍老師</div>
        </div>
        <div style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #0B6E6E; display: flex; align-items: center; justify-content: center;">
          <div style="width: 10px; height: 10px; border-radius: 50%; background: #0B6E6E;"></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #E3E8EA; border-radius: 10px; padding: 12px 14px;">
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 12px; color: #5A6A70;">朱懿辰</div>
          <div style="font-size: 15px; font-weight: 500;">Arthur</div>
        </div>
        <div style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #0B6E6E; display: flex; align-items: center; justify-content: center;">
          <div style="width: 10px; height: 10px; border-radius: 50%; background: #0B6E6E;"></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #E3E8EA; border-radius: 10px; padding: 12px 14px;">
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 12px; color: #5A6A70;">九千歲</div>
          <div style="font-size: 15px; font-weight: 500;">網飛</div>
        </div>
        <div style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #0B6E6E; display: flex; align-items: center; justify-content: center;">
          <div style="width: 10px; height: 10px; border-radius: 50%; background: #0B6E6E;"></div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 20px 18px 0;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 13px; font-weight: 700; color: #5A6A70;">目前排隊</div>
      <div style="font-size: 13px; font-weight: 500; color: #0B6E6E;">1 / 4 組</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; background: #F4F6F8; border-radius: 10px; padding: 12px 14px;">
      <div style="width: 22px; height: 22px; border-radius: 50%; background: #0B6E6E; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">1</div>
      <div style="flex: 1; font-size: 15px; font-weight: 500;">小沈</div>
      <div style="font-size: 12px; font-weight: 700; color: #0B6E6E;">正選</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #E3E8EA; overflow: hidden;">
        <div style="width: 25%; height: 6px; background: #0B6E6E;"></div>
      </div>
      <div style="font-size: 12px; color: #5A6A70;">還有 3 個候補</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-top: 1px solid #E3E8EA;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 14px; color: #5A6A70;">訂金</div>
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -.02em;">NT$ 1,000</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; background: #0B6E6E; color: #FFFFFF; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 700;">立即預約</div>
  </div>

</div>
</x-dc>
</body>
</html>
