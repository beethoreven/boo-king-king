<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans TC", system-ui, sans-serif; }
    a { color: #C8975A; } a:hover { color: #E0B478; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; min-height: 844px; background: #14120F; color: #EDE8E0;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 22px 0;">
    <div style="font-size: 12px; letter-spacing: .24em; color: #8A8177; font-weight: 300;">BOOKING KING</div>
    <div style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid #3A342C; display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8177" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 40px 22px 0;">
    <div style="width: 34px; height: 1px; background: #C8975A;"></div>
    <div style="font-family: 'Noto Serif TC', serif; font-size: 38px; font-weight: 700; letter-spacing: .06em; line-height: 1.15;">竊雲台</div>
    <div style="font-size: 14px; font-weight: 300; color: #A79C8E; line-height: 1.9;">十小時 · 六人 · 沉浸推理</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 34px 22px 0;">
    <div style="font-size: 11px; letter-spacing: .2em; color: #6E665B;">場次</div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid #2A251E;">
      <div style="font-family: 'Noto Serif TC', serif; font-size: 26px; font-weight: 600; letter-spacing: .04em;">8.30</div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px;">
        <div style="font-size: 15px; color: #EDE8E0;">週六 10:00</div>
        <div style="font-size: 12px; font-weight: 300; color: #8A8177;">預計 20:00 結束</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 30px 22px 0;">
    <div style="font-size: 11px; letter-spacing: .2em; color: #6E665B;">主持陣容</div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: baseline; gap: 14px;">
        <div style="font-family: 'Noto Serif TC', serif; font-size: 17px; color: #C8975A; min-width: 68px;">柳送君</div>
        <div style="flex: 1; height: 1px; background: #2A251E;"></div>
        <div style="font-size: 14px; font-weight: 300; color: #A79C8E;">阿舍老師</div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 14px;">
        <div style="font-family: 'Noto Serif TC', serif; font-size: 17px; color: #C8975A; min-width: 68px;">朱懿辰</div>
        <div style="flex: 1; height: 1px; background: #2A251E;"></div>
        <div style="font-size: 14px; font-weight: 300; color: #A79C8E;">Arthur</div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 14px;">
        <div style="font-family: 'Noto Serif TC', serif; font-size: 17px; color: #C8975A; min-width: 68px;">九千歲</div>
        <div style="flex: 1; height: 1px; background: #2A251E;"></div>
        <div style="font-size: 14px; font-weight: 300; color: #A79C8E;">網飛</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 32px 22px 0;">
    <div style="font-size: 11px; letter-spacing: .2em; color: #6E665B;">目前排隊</div>
    <div style="display: flex; align-items: center; gap: 14px; background: #1E1B17; padding: 15px 18px;">
      <div style="font-family: 'Noto Serif TC', serif; font-size: 15px; color: #C8975A;">一</div>
      <div style="flex: 1; font-size: 15px;">小沈</div>
      <div style="font-size: 11px; letter-spacing: .12em; color: #14120F; background: #C8975A; padding: 4px 10px;">正選</div>
    </div>
    <div style="font-size: 13px; font-weight: 300; color: #8A8177;">尚餘 3 個候補名額</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 22px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 13px; font-weight: 300; color: #8A8177;">訂金</div>
      <div style="font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 600;">NT$ 1,000</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; background: #C8975A; color: #14120F; padding: 17px; font-size: 16px; font-weight: 500; letter-spacing: .14em;">立即預約</div>
  </div>

</div>
</x-dc>
</body>
</html>
